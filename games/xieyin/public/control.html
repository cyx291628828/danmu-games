<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>谐音梗猜词 · 控制台</title>
<link rel="stylesheet" href="/common/base.css">
<link rel="stylesheet" href="control.css">
</head>
<body data-view="game-control">

<!-- ═══════════ 谐音梗猜词 · 主播台控制台（嵌主播台框架 iframe，也可独立打开） ═══════════ -->
<section class="ctl-panel">
  <h1 class="ctl-game-title">🎯 谐音梗猜词 · 控制台</h1>

  <div class="ctl-group">
    <div class="ctl-group-title">🎯 局面控制</div>
    <div class="btn-row">
      <button id="btnStart" class="btn primary">开始游戏</button>
      <button id="btnNext" class="btn">下一题</button>
      <button id="btnReveal" class="btn warn">揭示答案</button>
      <button id="btnPause" class="btn">暂停</button>
      <button id="btnResume" class="btn">继续</button>
      <span data-power-pin></span>
    </div>
  </div>

  <div class="ctl-group">
    <div class="ctl-group-title">📊 实时状态 <span class="ctl-group-flag">答案仅主播可见，展示屏要等揭示后才显示</span></div>
    <div id="ctlAnswer" class="ctl-answer">--</div>
    <div id="ctlStatus" class="ctl-status"></div>
    <div id="ctlWinner" class="ctl-status"></div>
  </div>

  <div class="ctl-group">
    <div class="ctl-group-title">📡 接入与模拟 <span class="ctl-group-flag">模拟事件与真实弹幕走同一条管线</span></div>
    <div id="ctlFeedTools"></div>
    <div class="theme-row" data-theme-picker data-game="xieyin"></div>
  </div>

  <div class="ctl-group">
    <div class="ctl-group-title">⚙️ 游戏配置</div>
    <div class="cfg-row" id="cfgForm"></div>
  </div>

  <div class="ctl-group">
    <div class="ctl-group-title">🕘 最近答题</div>
    <div id="ctlHistory" class="ctl-history"></div>
  </div>
</section>

<script src="/common/core.js"></script>
<script src="control.js"></script>
</body>
</html>
