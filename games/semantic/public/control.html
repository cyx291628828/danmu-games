<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语义猜词 · 控制台</title>
<link rel="stylesheet" href="/common/base.css">
<style>
  /* 礼物多选 chips（首字解锁 / 提示词触发共用） */
  .ms-row { display: flex; align-items: flex-start; gap: 8px; margin: 4px 0; }
  .ms-name { flex: 0 0 auto; font-size: 13px; color: var(--sub); padding-top: 4px; }
  .ms-chips { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
  .ms-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; color: var(--text); cursor: pointer;
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px;
  }
  .ms-chip input { display: none; }
  .ms-chip.on { color: var(--on-chip); background: var(--gold); border-color: var(--gold); font-weight: 600; }
  .ms-note { flex: 0 0 auto; font-size: 11px; color: var(--dim); padding-top: 5px; }
</style>
</head>
<body data-view="game-control">

<!-- ═══════════ 语义猜词 · 主播台控制台（嵌在主播台框架 iframe 中，也可独立打开） ═══════════
     按功能分组（.ctl-group 公共样式）：局面控制 / 接入与模拟 / 实时状态 / 游戏配置 / 最近揭晓 / AI 播报 -->
<section class="ctl-panel">
  <h1 class="ctl-game-title">🌡️ 语义猜词 · 控制台</h1>

  <div class="ctl-group">
    <div class="ctl-group-title">🎯 局面控制</div>
    <div class="btn-row">
      <button id="btnStart" class="btn primary">开始一轮（随机谜底）</button>
      <button id="btnPause" class="btn">暂停</button>
      <button id="btnResume" class="btn">继续</button>
      <button id="btnReveal" class="btn warn">立即揭晓</button>
      <button id="btnNext" class="btn">立即下一轮</button>
      <span data-power-pin></span>
    </div>
    <div class="btn-row" style="margin-top:6px">
      <input id="customWord" type="text" maxlength="12" placeholder="自定义谜底词（须在词库内，如：西红柿）" style="flex:1;min-width:200px">
      <button id="btnStartWord" class="btn secondary">用此词开一轮</button>
    </div>
    <div class="cfg-hint">自定义谜底必须是词库内的词（常用词/短语均可）；留空点「开始一轮」则从答案池随机抽取。</div>
  </div>

  <div class="ctl-group">
    <div class="ctl-group-title">📡 接入与模拟 <span class="ctl-group-flag">模拟事件与真实弹幕走同一条管线</span></div>
    <!-- 直播间筛选 + 模拟观众套件（common core.js mountFeedTools 渲染） -->
    <div id="ctlFeedTools"></div>
    <!-- 展示屏主题选择器：core.js 自动挂载（data-game 为无 URL 参数时的兜底） -->
    <div class="theme-row" data-theme-picker data-game="semantic"></div>
  </div>

  <div class="ctl-group">
    <div class="ctl-group-title">📊 实时状态</div>
    <div id="ctlAnswer" class="ctl-answer">--</div>
    <div id="ctlStatus" class="ctl-status">状态: 空闲</div>
    <div id="ctlGuessStats" class="ctl-status" style="margin-top:4px">本轮已猜 0 词（弹幕 0 · 点赞 0 · 送礼 0）</div>
    <div class="cc-title" style="margin-top:8px">实时猜测榜（前 5）</div>
    <div id="ctlTop" class="ctl-clues"></div>
  </div>

  <div class="ctl-group">
    <div class="ctl-group-title">⚙️ 游戏配置</div>
    <div class="cfg-row" id="cfgForm">
      <!-- 配置表单由 control.js 动态生成（按功能分组） -->
    </div>
  </div>

  <div class="ctl-group">
    <div class="ctl-group-title">🕘 最近揭晓</div>
    <div id="ctlHistory" class="ctl-history"></div>
  </div>

  <div class="ctl-group">
    <div class="ctl-group-title">🤖 AI 语音播报 <span class="ctl-group-flag">通用播报中心：生成方式 / 逐点开关 / TTS 语速音色</span></div>
    <!-- 通用 AI 播报面板（common broadcast.js mountPanel 渲染，全游戏共用） -->
    <div id="bcPanel"></div>
  </div>
</section>

<script src="/common/core.js"></script>
<script src="/common/broadcast.js"></script>
<script src="control.js"></script>
</body>
</html>
